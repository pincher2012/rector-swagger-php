name: CI

on: [pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    name: ${{ matrix.actions.name }}
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        actions:
          - name: 'PHPStan'
            run: vendor/bin/phpstan
          - name: 'Tests'
            run: vendor/bin/phpunit

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          coverage: none

      -   uses: ramsey/composer-install@v2

      -   run: ${{ matrix.actions.run }}
